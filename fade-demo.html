<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Technical demonstration of CSS fade effect with scroll-based animation for PlayBookOps website.">
  <title>Fade Demo</title>
  <style>
    :root {
      --demo-bg: linear-gradient(135deg, #1a1a2e 0%, #0f1724 100%);
      --fade-color: #5c5c5c;
      --mask-size: 100%;
      --mask-edge: 18%;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: auto;
    }

    body {
      font-family: Inter, Segoe UI, system-ui, Arial, sans-serif;
      background: #0f1724;
      color: #fff;
    }

    .demo-root {
      height: 200vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--demo-bg);
    }

    .demo-section {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .demo-section .inner {
      max-width: 820px;
      padding: 2rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .demo-section h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .demo-section p {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    .demo-section::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--fade-color);
      -webkit-mask-image: linear-gradient(
        to left,
        rgba(0, 0, 0, 1) 0%,
        rgba(0, 0, 0, 1) var(--mask-size),
        rgba(0, 0, 0, 0) calc(var(--mask-size) + var(--mask-edge))
      );
      mask-image: linear-gradient(
        to left,
        rgba(0, 0, 0, 1) 0%,
        rgba(0, 0, 0, 1) var(--mask-size),
        rgba(0, 0, 0, 0) calc(var(--mask-size) + var(--mask-edge))
      );
    }
  </style>
</head>
<body>
  <main class="demo-root">
    <section class="demo-section">
      <div class="inner">
        <h1>Grey Fade Effect</h1>
        <p>The grey background slides in from the right on page load.</p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const root = document.documentElement;

      function updateMask() {
        const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight;
        const clientHeight = document.documentElement.clientHeight;
        const maxScroll = Math.max(scrollHeight - clientHeight, 1);
        const progress = Math.min(100, Math.max(0, (scrollTop / maxScroll) * 100));
        root.style.setProperty('--mask-size', progress + '%');
      }

      window.addEventListener('scroll', updateMask, { passive: true });
      window.addEventListener('resize', updateMask);
      document.addEventListener('DOMContentLoaded', updateMask);
      updateMask();
    })();
  </script>
</body>
</html>
